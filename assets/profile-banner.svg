<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Baskaruni Baskar Raju</title>
  <desc id="desc">Scholar at SAP, Bangalore, India. Applied AI, agent workflows, and developer tools. A subtle animated blue, teal, and violet gradient.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#101b32"/>
      <stop offset=".56" stop-color="#163c59"/>
      <stop offset="1" stop-color="#43346a"/>
    </linearGradient>
    <linearGradient id="titlePaint" x1="0" y1="0" x2="1" y2="0">
      <stop class="tone-a" stop-color="#a5f3fc"/>
      <stop offset=".5" stop-color="#e0f2fe"/>
      <stop class="tone-b" offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#2dd4bf"/><stop offset=".5" stop-color="#60a5fa"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#67e8f9" stop-opacity=".17"/><stop offset="1" stop-color="#67e8f9" stop-opacity="0"/></radialGradient>
    <clipPath id="boundary"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>
  <style>
    .tone-a { animation: hue-a 8s ease-in-out infinite; }
    .tone-b { animation: hue-b 8s ease-in-out infinite; }
    .name { animation: enter 1.2s ease-out both; }
    .ambient { animation: drift 12s ease-in-out infinite alternate; }
    .signal { animation: signal 5s ease-in-out infinite; }
    @keyframes hue-a { 0%,100% {stop-color:#a5f3fc} 50% {stop-color:#c4b5fd} }
    @keyframes hue-b { 0%,100% {stop-color:#c4b5fd} 50% {stop-color:#93c5fd} }
    @keyframes enter { from {opacity:.65;transform:translateY(7px)} to {opacity:1;transform:translateY(0)} }
    @keyframes drift { from {transform:translate(0,0)} to {transform:translate(-35px,12px)} }
    @keyframes signal { 0%,100% {opacity:.45} 50% {opacity:1} }
    @media (prefers-reduced-motion: reduce) { .tone-a,.tone-b,.name,.ambient,.signal {animation:none} }
  </style>
  <g clip-path="url(#boundary)">
    <rect width="1200" height="320" fill="url(#background)"/>
    <circle class="ambient" cx="1090" cy="100" r="260" fill="url(#glow)"/>
    <g fill="none" stroke="#c4b5fd" stroke-opacity=".18" stroke-width="1.5">
      <path d="M980 42L1088 83L1148 173L1082 264L974 223L928 130Z"/>
      <path d="M980 42L1082 264M1088 83L974 223M928 130L1148 173"/>
      <circle cx="1038" cy="153" r="90"/>
    </g>
    <g class="signal" fill="#99f6e4">
      <circle cx="980" cy="42" r="4"/><circle cx="1148" cy="173" r="4"/><circle cx="974" cy="223" r="4"/>
    </g>
    <rect x="54" y="55" width="4" height="211" rx="2" fill="url(#accent)"/>
    <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif">
      <text x="82" y="83" fill="#a5f3fc" font-size="18" font-weight="600" letter-spacing="2.4">SCHOLAR@SAP</text>
      <text class="name" x="78" y="158" fill="url(#titlePaint)" font-size="56" font-weight="700">Baskaruni Baskar Raju</text>
      <text x="82" y="207" fill="#e2e8f0" font-size="27">Applied AI &amp; Developer Tools</text>
      <text x="83" y="248" fill="#bacddd" font-size="17" letter-spacing=".3">RAG · Agent Workflows · Enterprise Integration</text>
    </g>
    <rect y="314" width="1200" height="6" fill="url(#accent)"/>
  </g>
</svg>
